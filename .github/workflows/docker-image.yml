name: Docker Image CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Use checkout v4
        uses: actions/checkout@v4
        with:
          fetch_depth: 0 # Usa el último commit

      # Paso para autenticarse en dockerhub
      - name: Authenticate on dockerhub
        # Crea variables de entorno reusables
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: oayala775/docker-graphql
        run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

      # Construir la imagen
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag $IMAGE_NAME:0.0.1

      - name: Push docker image to DockerHub
        run: docker push $IMAGE_NAME:0.0.1 .
